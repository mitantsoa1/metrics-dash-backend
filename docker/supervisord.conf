[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Serveur web (ex-CMD du Dockerfile)
[program:web]
command=frankenphp php-server --root public/ --listen :80
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Worker de la file d'ingestion (PU-51) : sans lui, rien n'est ecrit dans raw_events.
; Pas de --tries : PersistRawEventsJob porte deja ses 5 essais et ses delais.
; --max-time : le worker redemarre toutes les heures (code rechargé apres deploiement).
[program:worker]
command=php /app/artisan queue:work --sleep=3 --max-time=3600 --timeout=120
directory=/app
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Planificateur : fenetres de 10 min, rapports programmes, agregation horaire.
[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
